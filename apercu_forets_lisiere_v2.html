<!doctype html><html lang="fr"><meta charset="utf-8"><title>Forêts lisière v2 — 4 cartes (est, couloir NE, caverne mousse, clairière)</title>
<style>

h1{margin:0 0 8px} .warn{border-left:4px solid #e0a24a;padding:8px 12px;background:#3a2c1a;max-width:900px}
select,button{margin:4px 6px 4px 0;padding:6px 10px;background:#2b4a3a;color:#fff;border:0;border-radius:6px}

<h1>Forêts lisière v2 — suite (est / couloir / caverne / clairière)</h1>
<p>4 cartes de plus 928×1152, 9 calques, jour/nuit, multicalques. v1 (A–D) inchangée. Pixels générés, PMDO non testé.</p>
<div class="warn">E entrée est · F couloir NE · G caverne moussue · H clairière secrète. Arrivée sud.</div>
<p><select id="map"></select><button id="mode">Nuit</button><button id="zoom">×1</button><button id="tous">Tout</button></p>

<script>
const DATA=[{"id": "E_foret_entree_est", "title": "Forêt — entrée de donjon dans la lisière est", "layers": [{"id": "01_sol_herbe", "jour": "renders/forets_lisiere_v2/E_foret_entree_est/calques/01_sol_herbe.png", "nuit": "renders/forets_lisiere_v2/E_foret_entree_est/nuit/01_sol_herbe_nuit.png"}, {"id": "02_lisiere_foret", "jour": "renders/forets_lisiere_v2/E_foret_entree_est/calques/02_lisiere_foret.png", "nuit": "renders/forets_lisiere_v2/E_foret_entree_est/nuit/02_lisiere_foret_nuit.png"}, {"id": "03_chemin", "jour": "renders/forets_lisiere_v2/E_foret_entree_est/calques/03_chemin.png", "nuit": "renders/forets_lisiere_v2/E_foret_entree_est/nuit/03_chemin_nuit.png"}, {"id": "04_parois_roche", "jour": "renders/forets_lisiere_v2/E_foret_entree_est/calques/04_parois_roche.png", "nuit": "renders/forets_lisiere_v2/E_foret_entree_est/nuit/04_parois_roche_nuit.png"}, {"id": "05_entree_grotte", "jour": "renders/forets_lisiere_v2/E_foret_entree_est/calques/05_entree_grotte.png", "nuit": "renders/forets_lisiere_v2/E_foret_entree_est/nuit/05_entree_grotte_nuit.png"}, {"id": "06_rochers", "jour": "renders/forets_lisiere_v2/E_foret_entree_est/calques/06_rochers.png", "nuit": "renders/forets_lisiere_v2/E_foret_entree_est/nuit/06_rochers_nuit.png"}, {"id": "07_vegetation_basse", "jour": "renders/forets_lisiere_v2/E_foret_entree_est/calques/07_vegetation_basse.png", "nuit": "renders/forets_lisiere_v2/E_foret_entree_est/nuit/07_vegetation_basse_nuit.png"}, {"id": "08_troncs_ombres", "jour": "renders/forets_lisiere_v2/E_foret_entree_est/calques/08_troncs_ombres.png", "nuit": "renders/forets_lisiere_v2/E_foret_entree_est/nuit/08_troncs_ombres_nuit.png"}, {"id": "09_canopees", "jour": "renders/forets_lisiere_v2/E_foret_entree_est/calques/09_canopees.png", "nuit": "renders/forets_lisiere_v2/E_foret_entree_est/nuit/09_canopees_nuit.png"}]}, {"id": "F_couloir_foret_ne", "title": "Couloir de forêt — grotte dans la lisière nord-est", "layers": [{"id": "01_sol_herbe", "jour": "renders/forets_lisiere_v2/F_couloir_foret_ne/calques/01_sol_herbe.png", "nuit": "renders/forets_lisiere_v2/F_couloir_foret_ne/nuit/01_sol_herbe_nuit.png"}, {"id": "02_lisiere_foret", "jour": "renders/forets_lisiere_v2/F_couloir_foret_ne/calques/02_lisiere_foret.png", "nuit": "renders/forets_lisiere_v2/F_couloir_foret_ne/nuit/02_lisiere_foret_nuit.png"}, {"id": "03_chemin", "jour": "renders/forets_lisiere_v2/F_couloir_foret_ne/calques/03_chemin.png", "nuit": "renders/forets_lisiere_v2/F_couloir_foret_ne/nuit/03_chemin_nuit.png"}, {"id": "04_parois_roche", "jour": "renders/forets_lisiere_v2/F_couloir_foret_ne/calques/04_parois_roche.png", "nuit": "renders/forets_lisiere_v2/F_couloir_foret_ne/nuit/04_parois_roche_nuit.png"}, {"id": "05_entree_grotte", "jour": "renders/forets_lisiere_v2/F_couloir_foret_ne/calques/05_entree_grotte.png", "nuit": "renders/forets_lisiere_v2/F_couloir_foret_ne/nuit/05_entree_grotte_nuit.png"}, {"id": "06_rochers", "jour": "renders/forets_lisiere_v2/F_couloir_foret_ne/calques/06_rochers.png", "nuit": "renders/forets_lisiere_v2/F_couloir_foret_ne/nuit/06_rochers_nuit.png"}, {"id": "07_vegetation_basse", "jour": "renders/forets_lisiere_v2/F_couloir_foret_ne/calques/07_vegetation_basse.png", "nuit": "renders/forets_lisiere_v2/F_couloir_foret_ne/nuit/07_vegetation_basse_nuit.png"}, {"id": "08_troncs_ombres", "jour": "renders/forets_lisiere_v2/F_couloir_foret_ne/calques/08_troncs_ombres.png", "nuit": "renders/forets_lisiere_v2/F_couloir_foret_ne/nuit/08_troncs_ombres_nuit.png"}, {"id": "09_canopees", "jour": "renders/forets_lisiere_v2/F_couloir_foret_ne/calques/09_canopees.png", "nuit": "renders/forets_lisiere_v2/F_couloir_foret_ne/nuit/09_canopees_nuit.png"}]}, {"id": "G_caverne_mousse", "title": "Caverne moussue — ouverture sud vers la forêt", "layers": [{"id": "01_sol_herbe", "jour": "renders/forets_lisiere_v2/G_caverne_mousse/calques/01_sol_herbe.png", "nuit": "renders/forets_lisiere_v2/G_caverne_mousse/nuit/01_sol_herbe_nuit.png"}, {"id": "02_lisiere_foret", "jour": "renders/forets_lisiere_v2/G_caverne_mousse/calques/02_lisiere_foret.png", "nuit": "renders/forets_lisiere_v2/G_caverne_mousse/nuit/02_lisiere_foret_nuit.png"}, {"id": "03_chemin", "jour": "renders/forets_lisiere_v2/G_caverne_mousse/calques/03_chemin.png", "nuit": "renders/forets_lisiere_v2/G_caverne_mousse/nuit/03_chemin_nuit.png"}, {"id": "04_parois_roche", "jour": "renders/forets_lisiere_v2/G_caverne_mousse/calques/04_parois_roche.png", "nuit": "renders/forets_lisiere_v2/G_caverne_mousse/nuit/04_parois_roche_nuit.png"}, {"id": "05_entree_grotte", "jour": "renders/forets_lisiere_v2/G_caverne_mousse/calques/05_entree_grotte.png", "nuit": "renders/forets_lisiere_v2/G_caverne_mousse/nuit/05_entree_grotte_nuit.png"}, {"id": "06_rochers", "jour": "renders/forets_lisiere_v2/G_caverne_mousse/calques/06_rochers.png", "nuit": "renders/forets_lisiere_v2/G_caverne_mousse/nuit/06_rochers_nuit.png"}, {"id": "07_vegetation_basse", "jour": "renders/forets_lisiere_v2/G_caverne_mousse/calques/07_vegetation_basse.png", "nuit": "renders/forets_lisiere_v2/G_caverne_mousse/nuit/07_vegetation_basse_nuit.png"}, {"id": "08_troncs_ombres", "jour": "renders/forets_lisiere_v2/G_caverne_mousse/calques/08_troncs_ombres.png", "nuit": "renders/forets_lisiere_v2/G_caverne_mousse/nuit/08_troncs_ombres_nuit.png"}, {"id": "09_canopees", "jour": "renders/forets_lisiere_v2/G_caverne_mousse/calques/09_canopees.png", "nuit": "renders/forets_lisiere_v2/G_caverne_mousse/nuit/09_canopees_nuit.png"}]}, {"id": "H_clairiere_secrete", "title": "Clairière secrète — fond de forêt, petite grotte nord", "layers": [{"id": "01_sol_herbe", "jour": "renders/forets_lisiere_v2/H_clairiere_secrete/calques/01_sol_herbe.png", "nuit": "renders/forets_lisiere_v2/H_clairiere_secrete/nuit/01_sol_herbe_nuit.png"}, {"id": "02_lisiere_foret", "jour": "renders/forets_lisiere_v2/H_clairiere_secrete/calques/02_lisiere_foret.png", "nuit": "renders/forets_lisiere_v2/H_clairiere_secrete/nuit/02_lisiere_foret_nuit.png"}, {"id": "03_chemin", "jour": "renders/forets_lisiere_v2/H_clairiere_secrete/calques/03_chemin.png", "nuit": "renders/forets_lisiere_v2/H_clairiere_secrete/nuit/03_chemin_nuit.png"}, {"id": "04_parois_roche", "jour": "renders/forets_lisiere_v2/H_clairiere_secrete/calques/04_parois_roche.png", "nuit": "renders/forets_lisiere_v2/H_clairiere_secrete/nuit/04_parois_roche_nuit.png"}, {"id": "05_entree_grotte", "jour": "renders/forets_lisiere_v2/H_clairiere_secrete/calques/05_entree_grotte.png", "nuit": "renders/forets_lisiere_v2/H_clairiere_secrete/nuit/05_entree_grotte_nuit.png"}, {"id": "06_rochers", "jour": "renders/forets_lisiere_v2/H_clairiere_secrete/calques/06_rochers.png", "nuit": "renders/forets_lisiere_v2/H_clairiere_secrete/nuit/06_rochers_nuit.png"}, {"id": "07_vegetation_basse", "jour": "renders/forets_lisiere_v2/H_clairiere_secrete/calques/07_vegetation_basse.png", "nuit": "renders/forets_lisiere_v2/H_clairiere_secrete/nuit/07_vegetation_basse_nuit.png"}, {"id": "08_troncs_ombres", "jour": "renders/forets_lisiere_v2/H_clairiere_secrete/calques/08_troncs_ombres.png", "nuit": "renders/forets_lisiere_v2/H_clairiere_secrete/nuit/08_troncs_ombres_nuit.png"}, {"id": "09_canopees", "jour": "renders/forets_lisiere_v2/H_clairiere_secrete/calques/09_canopees.png", "nuit": "renders/forets_lisiere_v2/H_clairiere_secrete/nuit/09_canopees_nuit.png"}]}];
const MW=928,MH=1152; let nuit=false,zoom=0.5,cur=0; const state={}, imgs={};
const c=document.getElementById('c'),ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=false;
function load(s){return new Promise(r=>{const i=new Image(); i.onload=()=>r(i); i.src=s;});}
async function boot(){
 DATA.forEach((m,i)=>map.add(new Option(m.title,i)));
 await sel(0);
 map.onchange=()=>sel(+map.value);
}
async function sel(i){
 cur=i; const m=DATA[i]; document.getElementById('layers').innerHTML='';
 for(const l of m.layers){
  imgs[l.id]={j:await load(l.jour), n:await load(l.nuit)}; state[l.id]=true;
  const lab=document.createElement('label'); const cb=document.createElement('input');
  cb.type='checkbox'; cb.checked=true; cb.onchange=()=>{state[l.id]=cb.checked; draw();};
  const seul=document.createElement('button'); seul.textContent='Seul'; seul.onclick=()=>{m.layers.forEach(x=>state[x.id]=(x.id===l.id)); sync(); draw();};
  lab.append(cb,' ',l.id,' ',seul); document.getElementById('layers').append(lab);
 }
 draw();
}
function sync(){document.querySelectorAll('#layers input').forEach((cb,i)=>{cb.checked=state[DATA[cur].layers[i].id];});}
function draw(){
 c.width=MW*zoom; c.height=MH*zoom; ctx.imageSmoothingEnabled=false; ctx.clearRect(0,0,c.width,c.height);
 for(const l of DATA[cur].layers){ if(!state[l.id]||!imgs[l.id]) continue; ctx.drawImage(nuit?imgs[l.id].n:imgs[l.id].j,0,0,c.width,c.height); }
}
document.getElementById('mode').onclick=e=>{nuit=!nuit; e.target.textContent=nuit?'Jour':'Nuit'; draw();};
document.getElementById('zoom').onclick=e=>{zoom=zoom===0.5?1:0.5; e.target.textContent=zoom===0.5?'×1':'×0.5'; draw();};
document.getElementById('tous').onclick=()=>{DATA[cur].layers.forEach(l=>state[l.id]=true); sync(); draw();};
boot();
</script></html>
