<!doctype html><meta charset="utf-8"><title>Sommet coucher V5</title>
<style>body{background:#111;color:#ddd;font:14px sans-serif;margin:16px}canvas{image-rendering:pixelated;width:912px;border:1px solid #444}label{margin-right:12px}</style>
<h1>Sommet au coucher du soleil — V5 (multicalque)</h1><p>Aperçu non certifié. Soleil : 12 frames de la planche (100 ms).</p>
<div id="t"></div><canvas id="c" width="304" height="296"></canvas><p><label><input type="checkbox" id="col"> collisions</label></p>
<p><img src="renders/summit_coucher_v5/apercu/reference_vs_v5.png" style="image-rendering:pixelated"></p>
<script>
const B='renders/summit_coucher_v5/',P='SUMMITSUNSET_V5_',ld=s=>{const i=new Image();i.src=s;return i},on={};
const sky=ld(B+'calques/00_ciel.png'),ter=ld(B+'calques/02_terrain.png'),sun=[...Array(12).keys()].map(k=>ld(B+'soleil/'+P+'01_soleil_f'+String(k).padStart(2,'0')+'.png'));
['00_ciel','01_soleil','02_terrain'].forEach(n=>{on[n]=true;const l=document.createElement('label');l.innerHTML=`<input type=checkbox checked> ${n}`;l.firstChild.onchange=e=>on[n]=e.target.checked;t.appendChild(l)});
fetch(B+'manifest.json').then(r=>r.json()).then(m=>{const x=c.getContext('2d'),t0=performance.now();
(function d(now){const k=Math.floor((now-t0)/100)%12;x.clearRect(0,0,304,296);
 if(on['00_ciel'])x.drawImage(sky,0,0);if(on['01_soleil'])x.drawImage(sun[k],0,0);if(on['02_terrain'])x.drawImage(ter,0,0);
 if(col.checked){x.fillStyle='rgba(255,0,0,.35)';m.collisions_8px.forEach((row,j)=>row.forEach((v,i)=>{if(!v)x.fillRect(i*8,j*8,8,8)}))}
 requestAnimationFrame(d)})(t0)});
</script>
