<!doctype html><html lang=fr><meta charset=utf-8><title>Reverie Town v2 - aperçu</title>
<style>body{font-family:sans-serif;background:#222;color:#eee;margin:12px}canvas{image-rendering:pixelated;border:1px solid #555;max-width:100%}
label{margin-right:10px}.bar{margin:8px 0}</style>
<h1>Reverie Town v2 — tuiles natives Métano (kit falaises)</h1>
<div class=bar>Carte <select id=map><option value=NE>Nord-Est (RVT2_NE, natif)</option><option value=NO>Nord-Ouest (RVT2_NO, côté est miroir)</option></select>
<select id=mode><option value=jour>jour</option><option value=nuit>nuit</option></select>
<label><input type=checkbox id=anim checked> animation (4 phases, 10 ticks)</label>
<label><input type=range id=zoom min=1 max=3 value=1> zoom</label> <span id=layers></span></div>
<canvas id=c></canvas>
<p>Calques PNG 8 px : <code>RVT2_&lt;carte&gt;_NN_&lt;calque&gt;[_pN]_&lt;jour|nuit&gt;.png</code> — import « PNG to Tileset » dans PMDO Dev.
Paquet natif : <code>paquet_natif/Data/Ground/*.rsground</code> + <code>Content/Tile/*.tile</code> (voir README).</p>
<script>
const MAPS={"NE": {"layers": ["sol", "falaises", "anim", "objets"], "files": {"sol": ["RVT2_NE_00_sol_jour.png", "RVT2_NE_00_sol_nuit.png"], "falaises": ["RVT2_NE_01_falaises_jour.png", "RVT2_NE_01_falaises_nuit.png"], "anim": ["RVT2_NE_02_anim_p1_jour.png", "RVT2_NE_02_anim_p1_nuit.png", "RVT2_NE_02_anim_p2_jour.png", "RVT2_NE_02_anim_p2_nuit.png", "RVT2_NE_02_anim_p3_jour.png", "RVT2_NE_02_anim_p3_nuit.png", "RVT2_NE_02_anim_p4_jour.png", "RVT2_NE_02_anim_p4_nuit.png"], "objets": ["RVT2_NE_03_objets_jour.png", "RVT2_NE_03_objets_nuit.png"]}, "size": [123, 99]}, "NO": {"layers": ["sol", "falaises", "anim", "objets"], "files": {"sol": ["RVT2_NO_00_sol_jour.png", "RVT2_NO_00_sol_nuit.png"], "falaises": ["RVT2_NO_01_falaises_jour.png", "RVT2_NO_01_falaises_nuit.png"], "anim": ["RVT2_NO_02_anim_p1_jour.png", "RVT2_NO_02_anim_p1_nuit.png", "RVT2_NO_02_anim_p2_jour.png", "RVT2_NO_02_anim_p2_nuit.png", "RVT2_NO_02_anim_p3_jour.png", "RVT2_NO_02_anim_p3_nuit.png", "RVT2_NO_02_anim_p4_jour.png", "RVT2_NO_02_anim_p4_nuit.png"], "objets": ["RVT2_NO_03_objets_jour.png", "RVT2_NO_03_objets_nuit.png"]}, "size": [123, 99]}};const c=document.getElementById('c'),ctx=c.getContext('2d');let imgs={},phase=0;
function key(m,l,p,mode){const f=MAPS[m].files[l];const re=new RegExp('_p'+(p+1)+'_'+mode+'[.]png$');
 return f.find(x=>re.test(x))||f.find(x=>x.endsWith('_'+mode+'.png'));}
function load(src){if(imgs[src])return imgs[src];const i=new Image();i.src=src;imgs[src]=i;return i;}
function draw(){const m=document.getElementById('map').value,mode=document.getElementById('mode').value,z=+document.getElementById('zoom').value;
 const [w,h]=MAPS[m].size;c.width=w*8;c.height=h*8;c.style.width=(w*8*z)+'px';ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);
 for(const l of MAPS[m].layers){const cb=document.getElementById('l_'+l);if(cb&&!cb.checked)continue;
  const im=load('RVT2_'+m+'/'+key(m,l,phase,mode));if(im.complete&&im.naturalWidth)ctx.drawImage(im,0,0);else im.onload=draw;}}
function ui(){const m=document.getElementById('map').value;document.getElementById('layers').innerHTML=MAPS[m].layers.map(l=>'<label><input type=checkbox checked id="l_'+l+'" onchange="draw()"> '+l+'</label>').join('');draw();}
document.getElementById('map').onchange=ui;document.getElementById('mode').onchange=draw;document.getElementById('zoom').oninput=draw;
setInterval(()=>{if(document.getElementById('anim').checked){phase=(phase+1)%4;draw();}},1000/6*10);ui();
</script>
