<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Plan schématique R+2"><style>.edge{fill:none;stroke:#7c967e;stroke-width:3}.edge.door{stroke:#aa7a35;stroke-width:4}.edge.route{stroke:#d3942e;stroke-width:6}.node ellipse.body{fill:#eff2e3;stroke:#6e896e;stroke-width:2}.node.circulation ellipse.body{fill:#fcf0d8;stroke:#b28a49;stroke-dasharray:7 5}.node.prototype ellipse.body{fill:#eeebf4;stroke:#8b7e9b;stroke-dasharray:5 4}.node.exterior ellipse.body{fill:#e4eeea;stroke:#4e786e}.node.route ellipse.body{stroke:#c38729;stroke-width:4;fill:#fff1c9}.node.selected ellipse.body{stroke:#244e38;stroke-width:5}.node{cursor:pointer}.nt{font:600 15px system-ui,sans-serif;fill:#294533;text-anchor:middle;pointer-events:none}.ni{font:11px system-ui,sans-serif;fill:#76836a;text-anchor:middle;pointer-events:none}.port{fill:#456e54;stroke:#f7f6ed;stroke-width:2}.vertical{fill:#e6dcec;stroke:#8b729c;stroke-width:1.5}.vtext{font:600 10px system-ui,sans-serif;fill:#67477d;text-anchor:middle;pointer-events:none}.edge-label{font:10px system-ui,sans-serif;fill:#936721}</style><rect width="1200" height="640" fill="#f7f5eb"/><path class="edge door" data-link="CHEF" d="M1020.0,239.7 C1020.0,211.8 1020.0,187.9 1020.0,160.0"><title>CHEF : Hall des missions ↔ Salle du chef</title></path><text class="edge-label" x="1029.0" y="199.9">porte du chef</text><path class="edge" data-link="L21" d="M380.0,317.5 C305.0,317.5 234.6,318.8 159.6,318.8"><title>L21 : Hall des missions ↔ Retour courbe des résidents</title></path><path class="edge" data-link="L22" d="M159.6,121.2 C183.4,121.2 201.2,102.5 225.0,102.5"><title>L22 : Retour courbe des résidents ↔ Chambre des résidents</title></path><path class="edge" data-link="L23" d="M767.5,420.0 C767.5,439.2 767.5,455.8 767.5,475.0"><title>L23 : Hall des missions ↔ Palier des missions</title></path><g class="node" data-zone="02" tabindex="0" role="button" aria-label="Hall des missions"><title>Hall des missions — Grand ovale ho