<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Plan schématique R+3"><style>.edge{fill:none;stroke:#7c967e;stroke-width:3}.edge.door{stroke:#aa7a35;stroke-width:4}.edge.route{stroke:#d3942e;stroke-width:6}.node ellipse.body{fill:#eff2e3;stroke:#6e896e;stroke-width:2}.node.circulation ellipse.body{fill:#fcf0d8;stroke:#b28a49;stroke-dasharray:7 5}.node.prototype ellipse.body{fill:#eeebf4;stroke:#8b7e9b;stroke-dasharray:5 4}.node.exterior ellipse.body{fill:#e4eeea;stroke:#4e786e}.node.route ellipse.body{stroke:#c38729;stroke-width:4;fill:#fff1c9}.node.selected ellipse.body{stroke:#244e38;stroke-width:5}.node{cursor:pointer}.nt{font:600 15px system-ui,sans-serif;fill:#294533;text-anchor:middle;pointer-events:none}.ni{font:11px system-ui,sans-serif;fill:#76836a;text-anchor:middle;pointer-events:none}.port{fill:#456e54;stroke:#f7f6ed;stroke-width:2}.vertical{fill:#e6dcec;stroke:#8b729c;stroke-width:1.5}.vtext{font:600 10px system-ui,sans-serif;fill:#67477d;text-anchor:middle;pointer-events:none}.edge-label{font:10px system-ui,sans-serif;fill:#936721}</style><rect width="1200" height="640" fill="#f7f5eb"/><path class="edge" data-link="EXT_N" d="M570.0,82.0 C570.0,98.8 570.0,113.2 570.0,130.0"><title>EXT_N : Terrasse nord existante ↔ Accueil de la guilde</title></path><path class="edge" data-link="L31" d="M570.0,275.0 C570.0,325.8 570.0,369.2 570.0,420.0"><title>L31 : Accueil de la guilde ↔ Palier d’accueil</title></path><path class="edge" data-link="L32" d="M450.0,487.5 C421.4,487.5 403.6,455.0 375.0,455.0"><title>L32 : Palier d’accueil ↔ Retour courbe du veilleur</title></path><path class="edge" data-link="L33" d="M297.5,395.0 C297.5,354.2 230.0,340.8 230.0,300.0"><title>L33 : Retour courbe du veilleur ↔ Chambre du veilleur</title></path><path class="edge" data-link="L34" d="M690.0,487.5 C707.7,487.5 722.3,480.0 740.0,480.0"><title>L34 : Palier d’accueil ↔ Galerie des éclaireurs</title></path><path class="edge" data-link="L35" d="M89