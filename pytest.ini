# Configuration unique pour les 28 suites de tests du dépôt.
#
# Deux conventions cohabitent sous source/ :
#   - les lots « boréales / arène de glace » font `from . import build as b`
#     (import relatif, donc besoin de packages d'espace de noms) ;
#   - tous les autres importent `build` en module de premier niveau.
# Beaucoup de fichiers s'appellent aussi `test_build.py`, ce qui casse le mode
# d'import `prepend` de pytest lors d'une collecte groupée.
# `importlib` + `consider_namespace_packages` font tourner les deux conventions
# dans la même commande :
#
#     .venv/bin/python -m pytest            # tout, ~240 tests en 30 s
#     .venv/bin/python -m pytest source/zones_south_north_v3
#
[pytest]
testpaths = source
addopts = --import-mode=importlib -q
consider_namespace_packages = true
